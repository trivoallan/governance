name: release

# Keeps a release pull request open; merging it tags vX.Y.Z and creates the
# GitHub release, then publishes that version to npm as
# @trivoallan/ontrack-governance: the two environments of ADR-0012, both on tag.
# Configuration: release-please-config.json.
on:
  push:
    branches: [main]

# Nothing at workflow level: each job declares what it needs (ADR-0021 rule 3).
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # No permission for GITHUB_TOKEN: the action tags, releases and opens the
    # release pull request with RELEASE_PLEASE_TOKEN.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # vX.Y.Z, the tag and the GitHub release the sbom job attaches to.
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Actions may not open pull requests in this repository, and a pull
          # request opened with GITHUB_TOKEN would trigger no workflow anyway.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # ADR-0019 rule 6: the SBOM is built from what is released, by the release
  # run, and attached to the GitHub release. Same gate as publish. A job of its
  # own: attaching an asset needs contents: write, which the publish job, with
  # its OIDC token and npm environment, should not hold.
  sbom:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tagged commit, which is what npm publish packs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # Syft (vulnerabilities.sbom: cyclonedx, written by Syft). With no
      # node_modules, it reads package-lock.json and leaves devDependencies
      # out, so the SBOM lists what the tarball holds. The action's own release
      # upload fires only on a release event; this run is a push, hence gh.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      # --clobber: rerunning the job replaces the asset instead of failing.
      - run: gh release upload "$TAG" sbom.cdx.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # Runs only on the push that merged the release pull request: the commit
  # checked out is the one release-please just tagged.
  publish:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing: the job proves by OIDC that it is this workflow
      # in this repository, and the provenance (ADR-0021, level 2) comes with it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npm publish pushes nothing to git.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in a job that publishes: nothing from an earlier run
          # ends up in the package.
          package-manager-cache: false
      # Installs typescript from the lockfile (ADR-0020): npm publish runs the
      # prepare script, which compiles the check to dist/governance-check.js.
      - run: npm ci
      # Trusted publishing (npm 11.5.1+, shipped with Node 24) authenticates by
      # OIDC: no token. --provenance is implied; kept explicit for ADR-0021's check.
      - run: npm publish --provenance --access public
