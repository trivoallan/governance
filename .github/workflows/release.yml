name: release

# Keeps a release pull request open; merging it tags vX.Y.Z and creates the
# GitHub release, then publishes that version to npm as
# @trivoallan/ontrack-source: the two environments of ADR-0012, both on tag.
# Configuration: release-please-config.json.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        # ponytail: default GITHUB_TOKEN; its release pull request triggers no
        # workflow, so once a required check exists, switch to a PAT secret.
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Runs only on the push that merged the release pull request: the commit
  # checked out is the one release-please just tagged.
  publish:
    needs: release-please
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm provenance (ADR-0021, build level 2): signed by the runner's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in a job that publishes: nothing from an earlier run
          # ends up in the package.
          package-manager-cache: false
      # No install: the package ships adr/ and a stdlib-only script, nothing built.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
